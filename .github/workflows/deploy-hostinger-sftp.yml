# =================================================================================
# GitHub Actions Workflow: Deploy to Hostinger (SFTP Version)
# =================================================================================
# Versión alternativa usando SFTP en lugar de FTP
# Usa este workflow si el FTP regular no funciona

name: Deploy to Hostinger (SFTP)

# Trigger: Manual o en push a main
on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  deploy:
    name: Build and Deploy to Hostinger via SFTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Build del proyecto React
      - name: Build React app
        run: npm run build
        env:
          CI: false

      # 5. Deploy usando SFTP (más confiable que FTP)
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22  # Puerto SFTP/SSH
          local_path: './build/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftp_only: true
          delete_remote_files: false  # No borrar archivos existentes

      # 6. Notificación de éxito
      - name: Deployment Success
        run: |
          echo "✅ Deployment completado exitosamente via SFTP"
          echo "🌐 Sitio: https://dermicapro.com"
