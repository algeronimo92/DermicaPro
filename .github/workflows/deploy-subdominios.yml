# =================================================================================
# GitHub Actions Workflow: Deploy Subdominios a Hostinger
# =================================================================================
# Deploy automático de landing pages a subdominios:
# - hf-reservas.dermicapro.com
# - btx-reservas.dermicapro.com
# - hp-reservas.dermicapro.com

name: Deploy Subdominios a Hostinger

# Trigger: Manual o en push a main
on:
  push:
    branches:
      - main
    paths:
      - 'src/pages/HifuReservasPage.jsx'
      - 'src/pages/BotoxReservasPage.jsx'
      - 'src/pages/HollywoodPeelReservasPage.jsx'
      - 'src/pages/ReservasLandingPage.jsx'
      - 'src/App.jsx'
      - '.github/workflows/deploy-subdominios.yml'
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  deploy-subdominios:
    name: Build and Deploy Subdominios
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Build del proyecto React
      - name: 🔨 Build React app
        run: npm run build
        env:
          CI: false

      # 5. Deploy a hf-reservas.dermicapro.com
      - name: 🚀 Deploy HIFU Reservas (hf-reservas)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './build/*'
          remote_path: '/public_html/hf-reservas/'
          sftp_only: true
          delete_remote_files: false

      # 6. Deploy a btx-reservas.dermicapro.com
      - name: 🚀 Deploy Botox Reservas (btx-reservas)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './build/*'
          remote_path: '/public_html/btx-reservas/'
          sftp_only: true
          delete_remote_files: false

      # 7. Deploy a hp-reservas.dermicapro.com
      - name: 🚀 Deploy Hollywood Peel Reservas (hp-reservas)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './build/*'
          remote_path: '/public_html/hp-reservas/'
          sftp_only: true
          delete_remote_files: false

      # 8. Notificación de éxito
      - name: ✅ Deployment Success
        run: |
          echo "✅ Deploy de subdominios completado exitosamente"
          echo ""
          echo "🌐 Subdominios desplegados:"
          echo "   • https://hf-reservas.dermicapro.com"
          echo "   • https://btx-reservas.dermicapro.com"
          echo "   • https://hp-reservas.dermicapro.com"
          echo ""
          echo "⏱️  Los cambios pueden tardar 1-2 minutos en reflejarse"
