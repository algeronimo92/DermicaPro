# =================================================================================
# GitHub Actions Workflow: Deploy to Hostinger
# =================================================================================
# Deploy automático del sitio principal a Hostinger vía FTP

name: Deploy to Hostinger

# Trigger: Manual o en push a main
on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  deploy:
    name: Build and Deploy to Hostinger via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Build del proyecto React
      - name: Build React app
        run: npm run build
        env:
          CI: false

      # 5. Deploy sitio principal usando FTP
      - name: Deploy Sitio Principal
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./build/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          log-level: verbose
          timeout: 60000

      # 6. Notificación de éxito
      - name: Deployment Success
        run: |
          echo "✅ Deployment completado exitosamente via FTP"
          echo ""
          echo "🌐 Sitio desplegado:"
          echo "   • https://dermicapro.com (principal)"
