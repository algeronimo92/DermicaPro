<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado rosa claro -->
  <rect width="800" height="600" fill="url(#gradBorradoMicro)"/>
  <defs>
    <linearGradient id="gradBorradoMicro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Patrón decorativo -->
  <circle cx="120" cy="120" r="4" fill="#ea899a" opacity="0.2"/>
  <circle cx="680" cy="480" r="4" fill="#ea899a" opacity="0.2"/>
  <circle cx="200" cy="500" r="3" fill="#d37989" opacity="0.3"/>
  <circle cx="600" cy="100" r="3" fill="#d37989" opacity="0.3"/>

  <!-- Ojo con ceja antes (izquierda) -->
  <g transform="translate(250, 280)">
    <!-- Ceja con micropigmentación oscura -->
    <ellipse cx="0" cy="-40" rx="60" ry="12" fill="#4a2c2a" opacity="0.8"/>
    <!-- Ojo -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#9ca3af" opacity="0.3"/>
    <circle cx="0" cy="0" r="15" fill="#4a2c2a"/>
    <circle cx="3" cy="-3" r="5" fill="white"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 280)">
    <polygon points="0,-10 20,0 0,10" fill="#ea899a" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#ea899a" stroke-width="3"/>
  </g>

  <!-- Ojo con ceja después (derecha) -->
  <g transform="translate(550, 280)">
    <!-- Ceja natural más clara -->
    <ellipse cx="0" cy="-40" rx="60" ry="12" fill="#a0826d" opacity="0.4"/>
    <!-- Ojo -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#9ca3af" opacity="0.3"/>
    <circle cx="0" cy="0" r="15" fill="#4a2c2a"/>
    <circle cx="3" cy="-3" r="5" fill="white"/>
  </g>

  <!-- Láser -->
  <g transform="translate(400, 420)">
    <rect x="-15" y="-50" width="30" height="80" rx="5" fill="#ea899a" opacity="0.9"/>
    <circle cx="0" cy="-40" r="8" fill="#dc2626" opacity="0.7"/>
    <!-- Rayos láser -->
    <line x1="0" y1="-32" x2="0" y2="10" stroke="#dc2626" stroke-width="2" opacity="0.5"/>
    <line x1="-5" y1="-30" x2="-5" y2="8" stroke="#dc2626" stroke-width="1.5" opacity="0.3"/>
    <line x1="5" y1="-30" x2="5" y2="8" stroke="#dc2626" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Borrado de Micropigmentación
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Eliminación Profesional con Láser
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#ea899a" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Seguro
  </text>
</svg>
