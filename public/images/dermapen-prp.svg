<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado rosa-rojo (PRP) -->
  <rect width="800" height="600" fill="url(#gradPRP)"/>
  <defs>
    <linearGradient id="gradPRP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Patrón decorativo -->
  <circle cx="120" cy="120" r="4" fill="#dc2626" opacity="0.2"/>
  <circle cx="680" cy="480" r="4" fill="#dc2626" opacity="0.2"/>
  <circle cx="200" cy="500" r="3" fill="#ea899a" opacity="0.3"/>
  <circle cx="600" cy="100" r="3" fill="#ea899a" opacity="0.3"/>

  <!-- Icono de Dermapen + Tubo de sangre -->
  <g transform="translate(300, 280)">
    <!-- Dermapen -->
    <rect x="-30" y="-100" width="60" height="150" rx="8" fill="#ea899a" opacity="0.9"/>
    <rect x="-25" y="-95" width="50" height="140" rx="6" fill="white" opacity="0.3"/>
    <rect x="-35" y="50" width="70" height="35" rx="4" fill="#d37989"/>

    <!-- Microagujas -->
    <circle cx="-20" cy="75" r="2" fill="white"/>
    <circle cx="-7" cy="75" r="2" fill="white"/>
    <circle cx="6" cy="75" r="2" fill="white"/>
    <circle cx="19" cy="75" r="2" fill="white"/>
  </g>

  <!-- Tubo de PRP (sangre) -->
  <g transform="translate(500, 280)">
    <rect x="-20" y="-80" width="40" height="120" rx="5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <!-- Sangre (parte roja) -->
    <rect x="-18" y="20" width="36" height="18" fill="#dc2626" opacity="0.8"/>
    <!-- Plasma (parte amarilla) -->
    <rect x="-18" y="-10" width="36" height="28" fill="#fbbf24" opacity="0.7"/>
    <!-- Tapa -->
    <rect x="-22" y="-90" width="44" height="15" rx="3" fill="#6b7280"/>
  </g>

  <!-- Símbolo de combinación (+) -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="25" fill="#ea899a" opacity="0.9"/>
    <rect x="-12" y="-2" width="24" height="4" fill="white"/>
    <rect x="-2" y="-12" width="4" height="24" fill="white"/>
  </g>

  <!-- Ondas de regeneración -->
  <circle cx="400" cy="380" r="80" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.2"/>
  <circle cx="400" cy="380" r="100" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.15"/>
  <circle cx="400" cy="380" r="120" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.1"/>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Dermapen con PRP
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Plasma Rico en Plaquetas
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#dc2626" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    100% Natural
  </text>
</svg>
