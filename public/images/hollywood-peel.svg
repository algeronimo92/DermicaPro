<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado dorado-rosa -->
  <rect width="800" height="600" fill="url(#gradHollywood)"/>
  <defs>
    <linearGradient id="gradHollywood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
    <!-- Efecto de brillo -->
    <radialGradient id="glowHollywood">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Estrellas de Hollywood -->
  <g transform="translate(150, 120)">
    <polygon points="0,-20 5,-5 20,-5 8,3 12,18 0,8 -12,18 -8,3 -20,-5 -5,-5" fill="#fbbf24" opacity="0.6"/>
  </g>
  <g transform="translate(650, 480)">
    <polygon points="0,-15 4,-4 15,-4 6,2 9,13 0,6 -9,13 -6,2 -15,-4 -4,-4" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Rostro antes (izquierda) -->
  <g transform="translate(250, 280)">
    <circle cx="0" cy="0" r="70" fill="#f3d5c8" opacity="0.8"/>
    <!-- Imperfecciones -->
    <circle cx="-25" cy="-20" r="3" fill="#8b5a3c" opacity="0.4"/>
    <circle cx="20" cy="-10" r="2" fill="#8b5a3c" opacity="0.3"/>
    <circle cx="-15" cy="15" r="2.5" fill="#8b5a3c" opacity="0.35"/>
    <!-- Ojos -->
    <circle cx="-20" cy="-10" r="3" fill="#4a2c2a"/>
    <circle cx="20" cy="-10" r="3" fill="#4a2c2a"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 280)">
    <polygon points="0,-10 20,0 0,10" fill="#fbbf24" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Rostro después (derecha) - con brillo -->
  <g transform="translate(550, 280)">
    <circle cx="0" cy="0" r="70" fill="url(#glowHollywood)" opacity="0.4"/>
    <circle cx="0" cy="0" r="70" fill="#f3d5c8" opacity="0.9"/>
    <!-- Ojos -->
    <circle cx="-20" cy="-10" r="3" fill="#4a2c2a"/>
    <circle cx="20" cy="-10" r="3" fill="#4a2c2a"/>
    <!-- Brillo en mejillas -->
    <circle cx="-25" cy="10" r="8" fill="white" opacity="0.4"/>
    <circle cx="25" cy="10" r="8" fill="white" opacity="0.4"/>
  </g>

  <!-- Láser de carbón -->
  <g transform="translate(400, 420)">
    <rect x="-20" y="-60" width="40" height="90" rx="6" fill="#2d3748" opacity="0.9"/>
    <circle cx="0" cy="-40" r="10" fill="#10b981" opacity="0.8"/>
    <!-- Rayo láser verde -->
    <line x1="0" y1="-30" x2="0" y2="20" stroke="#10b981" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Partículas de carbón -->
  <circle cx="380" cy="350" r="2" fill="#2d3748" opacity="0.3"/>
  <circle cx="420" cy="360" r="1.5" fill="#2d3748" opacity="0.25"/>
  <circle cx="390" cy="370" r="1.8" fill="#2d3748" opacity="0.28"/>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Hollywood Peel
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Iluminación Instantánea
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#fbbf24" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Premium
  </text>
</svg>
