<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado verde-rosa -->
  <rect width="800" height="600" fill="url(#gradEnzimas)"/>
  <defs>
    <linearGradient id="gradEnzimas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Moléculas decorativas -->
  <circle cx="150" cy="150" r="5" fill="#10b981" opacity="0.3"/>
  <circle cx="650" cy="450" r="4" fill="#10b981" opacity="0.25"/>
  <circle cx="200" cy="500" r="3" fill="#059669" opacity="0.2"/>

  <!-- Papada antes (izquierda) -->
  <g transform="translate(250, 280)">
    <!-- Cuello con acumulación de grasa -->
    <ellipse cx="0" cy="40" rx="45" ry="35" fill="#f3d5c8" opacity="0.8"/>
    <ellipse cx="0" cy="50" rx="50" ry="30" fill="#e6c4b8" opacity="0.6"/>
    <!-- Rostro -->
    <circle cx="0" cy="0" r="60" fill="#f3d5c8" opacity="0.9"/>
    <!-- Ojos -->
    <circle cx="-18" cy="-10" r="3" fill="#4a2c2a"/>
    <circle cx="18" cy="-10" r="3" fill="#4a2c2a"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 280)">
    <polygon points="0,-10 20,0 0,10" fill="#10b981" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#10b981" stroke-width="3"/>
  </g>

  <!-- Papada después (derecha) - más definida -->
  <g transform="translate(550, 280)">
    <!-- Cuello más delgado -->
    <ellipse cx="0" cy="45" rx="35" ry="25" fill="#f3d5c8" opacity="0.9"/>
    <!-- Rostro -->
    <circle cx="0" cy="0" r="60" fill="#f3d5c8" opacity="0.9"/>
    <!-- Línea de mandíbula definida -->
    <path d="M -30,25 L 0,35 L 30,25" stroke="#d4a59a" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Ojos -->
    <circle cx="-18" cy="-10" r="3" fill="#4a2c2a"/>
    <circle cx="18" cy="-10" r="3" fill="#4a2c2a"/>
  </g>

  <!-- Vial de enzimas -->
  <g transform="translate(400, 420)">
    <rect x="-15" y="-50" width="30" height="70" rx="3" fill="#e5e7eb" opacity="0.9"/>
    <!-- Líquido verde (enzimas) -->
    <rect x="-13" y="-10" width="26" height="28" fill="#10b981" opacity="0.7"/>
    <!-- Etiqueta -->
    <rect x="-10" y="-35" width="20" height="15" fill="white" opacity="0.8"/>
    <text x="0" y="-23" font-family="Arial, sans-serif" font-size="8" fill="#059669" text-anchor="middle">Enzima</text>
    <!-- Tapa -->
    <rect x="-17" y="-55" width="34" height="8" rx="2" fill="#6b7280"/>
  </g>

  <!-- Jeringa aplicando -->
  <g transform="translate(320, 380)">
    <rect x="-3" y="-30" width="6" height="50" fill="#9ca3af" opacity="0.8"/>
    <polygon points="0,-30 -5,-40 5,-40" fill="#6b7280" opacity="0.8"/>
    <circle cx="0" y="-45" r="3" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Moléculas de enzimas (efecto) -->
  <g transform="translate(320, 330)">
    <circle cx="0" cy="0" r="3" fill="#10b981" opacity="0.4"/>
    <circle cx="-8" cy="5" r="2" fill="#10b981" opacity="0.3"/>
    <circle cx="8" cy="3" r="2.5" fill="#10b981" opacity="0.35"/>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Enzimas Recombinantes
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Reducción de Grasa Localizada
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#10b981" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    100% Natural
  </text>
</svg>
