<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado azul-púrpura -->
  <rect width="800" height="600" fill="url(#gradExosomas)"/>
  <defs>
    <linearGradient id="gradExosomas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
    <!-- Efecto de brillo científico -->
    <radialGradient id="glowExosomas">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Partículas científicas -->
  <circle cx="150" cy="150" r="3" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="650" cy="450" r="4" fill="#3b82f6" opacity="0.25"/>
  <circle cx="200" cy="500" r="2.5" fill="#8b5cf6" opacity="0.28"/>
  <circle cx="600" cy="120" r="3.5" fill="#3b82f6" opacity="0.3"/>

  <!-- Piel antes (izquierda) -->
  <g transform="translate(250, 280)">
    <rect x="-50" y="-60" width="100" height="120" rx="10" fill="#f3d5c8" opacity="0.8"/>
    <!-- Manchas -->
    <ellipse cx="-15" cy="-20" rx="8" ry="6" fill="#8b5a3c" opacity="0.5"/>
    <ellipse cx="20" cy="-10" rx="6" ry="5" fill="#8b5a3c" opacity="0.4"/>
    <ellipse cx="-10" cy="15" rx="7" ry="6" fill="#8b5a3c" opacity="0.45"/>
    <circle cx="15" cy="25" r="4" fill="#8b5a3c" opacity="0.4"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 280)">
    <polygon points="0,-10 20,0 0,10" fill="#8b5cf6" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#8b5cf6" stroke-width="3"/>
  </g>

  <!-- Piel después (derecha) - uniforme -->
  <g transform="translate(550, 280)">
    <rect x="-50" y="-60" width="100" height="120" rx="10" fill="#f3d5c8" opacity="0.95"/>
    <circle cx="0" cy="0" r="60" fill="url(#glowExosomas)" opacity="0.2"/>
    <!-- Brillo uniforme -->
    <ellipse cx="-20" cy="-15" rx="15" ry="10" fill="white" opacity="0.3"/>
    <ellipse cx="15" cy="10" rx="12" ry="8" fill="white" opacity="0.25"/>
  </g>

  <!-- Exosoma (vesícula científica) -->
  <g transform="translate(300, 150)">
    <circle cx="0" cy="0" r="35" fill="#8b5cf6" opacity="0.2"/>
    <circle cx="0" cy="0" r="25" fill="#8b5cf6" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="#8b5cf6" opacity="0.6"/>
    <!-- Membrana -->
    <circle cx="0" cy="0" r="25" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <!-- Moléculas internas -->
    <circle cx="-5" cy="-3" r="3" fill="#c4b5fd"/>
    <circle cx="5" cy="2" r="2.5" fill="#c4b5fd"/>
    <circle cx="0" cy="5" r="2" fill="#c4b5fd"/>
  </g>

  <!-- Molécula de Ácido Tranexámico -->
  <g transform="translate(500, 150)">
    <circle cx="0" cy="0" r="30" fill="#3b82f6" opacity="0.2"/>
    <!-- Estructura molecular simplificada -->
    <circle cx="0" cy="0" r="5" fill="#3b82f6"/>
    <circle cx="-15" cy="0" r="4" fill="#60a5fa"/>
    <circle cx="15" cy="0" r="4" fill="#60a5fa"/>
    <circle cx="0" cy="-15" r="4" fill="#60a5fa"/>
    <circle cx="0" cy="15" r="4" fill="#60a5fa"/>
    <!-- Conexiones -->
    <line x1="-15" y1="0" x2="0" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#3b82f6" stroke-width="2"/>
  </g>

  <!-- Símbolo de combinación -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="20" fill="#8b5cf6" opacity="0.8"/>
    <rect x="-10" y="-2" width="20" height="4" fill="white"/>
    <rect x="-2" y="-10" width="4" height="20" fill="white"/>
  </g>

  <!-- Jeringa de aplicación -->
  <g transform="translate(400, 420)">
    <rect x="-3" y="-40" width="6" height="60" fill="#9ca3af" opacity="0.8"/>
    <polygon points="0,-40 -5,-50 5,-50" fill="#6b7280" opacity="0.8"/>
    <circle cx="0" cy="-55" r="3" fill="#8b5cf6" opacity="0.7"/>
  </g>

  <!-- Ondas de regeneración -->
  <circle cx="550" cy="280" r="80" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.2"/>
  <circle cx="550" cy="280" r="100" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.15"/>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Exosomas con Ácido Tranexámico
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Regeneración Celular Avanzada
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#8b5cf6" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Científico
  </text>
</svg>
