<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado naranja-rosa (vitamina C) -->
  <rect width="800" height="600" fill="url(#gradVC)"/>
  <defs>
    <linearGradient id="gradVC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffedd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>

    <!-- Definición de resplandor -->
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Rayos de luz decorativos -->
  <g opacity="0.2">
    <line x1="400" y1="50" x2="400" y2="120" stroke="#f59e0b" stroke-width="3"/>
    <line x1="550" y1="100" x2="600" y2="150" stroke="#f59e0b" stroke-width="3"/>
    <line x1="250" y1="100" x2="200" y2="150" stroke="#f59e0b" stroke-width="3"/>
    <line x1="620" y1="200" x2="680" y2="220" stroke="#f59e0b" stroke-width="3"/>
    <line x1="180" y1="200" x2="120" y2="220" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Partículas brillantes -->
  <circle cx="150" cy="450" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="650" cy="150" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="200" cy="120" r="2" fill="#f59e0b" opacity="0.4"/>
  <circle cx="600" cy="480" r="2" fill="#f59e0b" opacity="0.4"/>

  <!-- Dermapen -->
  <g transform="translate(280, 280)">
    <rect x="-30" y="-100" width="60" height="150" rx="8" fill="#ea899a" opacity="0.9"/>
    <rect x="-25" y="-95" width="50" height="140" rx="6" fill="white" opacity="0.3"/>
    <rect x="-35" y="50" width="70" height="35" rx="4" fill="#d37989"/>

    <!-- Microagujas -->
    <circle cx="-20" cy="75" r="2" fill="white"/>
    <circle cx="-7" cy="75" r="2" fill="white"/>
    <circle cx="6" cy="75" r="2" fill="white"/>
    <circle cx="19" cy="75" r="2" fill="white"/>
  </g>

  <!-- Naranja estilizada (Vitamina C) -->
  <g transform="translate(520, 260)">
    <!-- Rodaja de naranja -->
    <circle cx="0" cy="0" r="50" fill="#f59e0b" opacity="0.9"/>
    <circle cx="0" cy="0" r="45" fill="#fbbf24" opacity="0.8"/>

    <!-- Gajos -->
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-35" y1="-20" x2="35" y2="20" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-35" y1="20" x2="35" y2="-20" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#f59e0b" stroke-width="2"/>

    <!-- Círculo central -->
    <circle cx="0" cy="0" r="8" fill="#fef3c7" opacity="0.8"/>

    <!-- Brillo -->
    <circle cx="-15" cy="-15" r="8" fill="white" opacity="0.6"/>

    <!-- Texto "C" en el centro -->
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
      C
    </text>
  </g>

  <!-- Símbolo + -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="25" fill="#f59e0b" opacity="0.9"/>
    <rect x="-12" y="-2" width="24" height="4" fill="white"/>
    <rect x="-2" y="-12" width="4" height="24" fill="white"/>
  </g>

  <!-- Resplandor de antioxidantes -->
  <circle cx="520" cy="260" r="70" fill="url(#glow)" opacity="0.3"/>

  <!-- Ondas de luminosidad -->
  <circle cx="400" cy="380" r="80" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="400" cy="380" r="100" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.2"/>
  <circle cx="400" cy="380" r="120" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.1"/>

  <!-- Estrellas brillantes -->
  <g transform="translate(180, 200)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="#fbbf24" opacity="0.5"/>
  </g>
  <g transform="translate(620, 420)">
    <polygon points="0,-6 1.5,-1.5 6,-1.5 2.25,1.5 3.75,6 0,3 -3.75,6 -2.25,1.5 -6,-1.5 -1.5,-1.5" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Dermapen con Vitamina C
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Iluminación + Antioxidante
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#f59e0b" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Iluminador
  </text>
</svg>
