<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado verde-rosa -->
  <rect width="800" height="600" fill="url(#gradGrasa)"/>
  <defs>
    <linearGradient id="gradGrasa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee2e2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Silueta antes (izquierda) -->
  <g transform="translate(250, 300)">
    <!-- Torso con grasa -->
    <ellipse cx="0" cy="-20" rx="60" ry="70" fill="#f3d5c8" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="70" ry="60" fill="#e6c4b8" opacity="0.6"/>
    <!-- Áreas de acumulación de grasa -->
    <ellipse cx="-45" cy="10" rx="20" ry="25" fill="#fbbf24" opacity="0.3"/>
    <ellipse cx="45" cy="10" rx="20" ry="25" fill="#fbbf24" opacity="0.3"/>
    <ellipse cx="0" cy="40" rx="30" ry="20" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 300)">
    <polygon points="0,-10 20,0 0,10" fill="#10b981" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#10b981" stroke-width="3"/>
  </g>

  <!-- Silueta después (derecha) - más delgada -->
  <g transform="translate(550, 300)">
    <!-- Torso más delgado -->
    <ellipse cx="0" cy="-20" rx="50" ry="70" fill="#f3d5c8" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="#e6c4b8" opacity="0.7"/>
    <!-- Cintura definida -->
    <path d="M -35,-10 Q -30,20 -25,40" stroke="#d4a59a" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 35,-10 Q 30,20 25,40" stroke="#d4a59a" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Áreas de tratamiento marcadas (antes) -->
  <g transform="translate(250, 300)">
    <circle cx="-45" cy="10" r="22" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="3,3"/>
    <circle cx="45" cy="10" r="22" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="3,3"/>
    <ellipse cx="0" cy="40" rx="32" ry="22" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="3,3"/>
  </g>

  <!-- Vial de enzimas -->
  <g transform="translate(400, 150)">
    <rect x="-12" y="-40" width="24" height="55" rx="3" fill="#e5e7eb" opacity="0.9"/>
    <!-- Líquido verde -->
    <rect x="-10" y="-5" width="20" height="20" fill="#10b981" opacity="0.7"/>
    <!-- Tapa -->
    <rect x="-14" y="-45" width="28" height="8" rx="2" fill="#6b7280"/>
    <text x="0" y="-50" font-family="Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">Enzima</text>
  </g>

  <!-- Jeringa -->
  <g transform="translate(350, 200)">
    <rect x="-2" y="-25" width="4" height="40" fill="#9ca3af" opacity="0.8"/>
    <polygon points="0,-25 -4,-33 4,-33" fill="#6b7280" opacity="0.8"/>
    <circle cx="0" cy="-38" r="2.5" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Células de grasa siendo eliminadas -->
  <g transform="translate(320, 280)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24" opacity="0.4"/>
    <circle cx="-10" cy="8" r="3" fill="#fbbf24" opacity="0.3"/>
    <circle cx="10" cy="5" r="3.5" fill="#fbbf24" opacity="0.35"/>
    <!-- Flechas de salida -->
    <line x1="0" y1="0" x2="-15" y2="-15" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
    <line x1="-10" y1="8" x2="-20" y2="15" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Grasa Localizada
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Eliminación Efectiva
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#10b981" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Resultados Visibles
  </text>
</svg>
