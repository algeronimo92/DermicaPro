<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado -->
  <rect width="800" height="600" fill="url(#gradPapada)"/>
  <defs>
    <linearGradient id="gradPapada" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Perfil antes (izquierda) -->
  <g transform="translate(220, 250)">
    <!-- Cabeza de perfil -->
    <ellipse cx="0" cy="0" rx="55" ry="65" fill="#f3d5c8" opacity="0.9"/>
    <!-- Nariz -->
    <path d="M 50,0 L 65,-5 L 60,5" fill="#e6c4b8" opacity="0.8"/>
    <!-- Papada pronunciada -->
    <path d="M 30,50 Q 40,75 20,80 Q 0,85 -10,70 L 10,50" fill="#e6c4b8" opacity="0.7"/>
    <ellipse cx="15" cy="65" rx="25" ry="20" fill="#d9b5a9" opacity="0.5"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 300)">
    <polygon points="0,-10 20,0 0,10" fill="#0ea5e9" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#0ea5e9" stroke-width="3"/>
  </g>

  <!-- Perfil después (derecha) -->
  <g transform="translate(580, 250)">
    <!-- Cabeza de perfil -->
    <ellipse cx="0" cy="0" rx="55" ry="65" fill="#f3d5c8" opacity="0.9"/>
    <!-- Nariz -->
    <path d="M 50,0 L 65,-5 L 60,5" fill="#e6c4b8" opacity="0.8"/>
    <!-- Cuello definido sin papada -->
    <path d="M 30,50 L 25,75 L 10,80 L -5,70 L 10,50" fill="#e6c4b8" opacity="0.8"/>
    <!-- Línea de mandíbula definida -->
    <path d="M 40,40 L 25,50" stroke="#d4a59a" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Área de reducción marcada -->
  <g transform="translate(220, 315)">
    <ellipse cx="15" cy="0" rx="20" ry="15" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Símbolo de medición -->
  <g transform="translate(220, 340)">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#6b7280" stroke-width="1.5" opacity="0.5"/>
    <line x1="-5" y1="-20" x2="5" y2="-20" stroke="#6b7280" stroke-width="1.5" opacity="0.5"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#6b7280" stroke-width="1.5" opacity="0.5"/>
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">-50%</text>
  </g>

  <!-- Iconos de métodos -->
  <g transform="translate(150, 450)">
    <!-- HIFU -->
    <circle cx="0" cy="0" r="25" fill="#0ea5e9" opacity="0.2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle" font-weight="bold">HIFU</text>
  </g>

  <g transform="translate(250, 450)">
    <!-- Enzimas -->
    <circle cx="0" cy="0" r="25" fill="#10b981" opacity="0.2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle" font-weight="bold">Enzimas</text>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Reducción de Papada
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Perfil Definido sin Cirugía
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#0ea5e9" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    No Invasivo
  </text>
</svg>
