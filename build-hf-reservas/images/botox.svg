<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado azul suave -->
  <rect width="800" height="600" fill="url(#gradBotox)"/>
  <defs>
    <linearGradient id="gradBotox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Patrón decorativo -->
  <circle cx="150" cy="150" r="3" fill="#3b82f6" opacity="0.2"/>
  <circle cx="650" cy="450" r="4" fill="#3b82f6" opacity="0.25"/>

  <!-- Rostro antes (izquierda) - con arrugas -->
  <g transform="translate(250, 280)">
    <circle cx="0" cy="0" r="70" fill="#f3d5c8" opacity="0.9"/>
    <!-- Arrugas de expresión -->
    <path d="M -35,-25 Q -30,-20 -25,-25" stroke="#8b5a3c" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M -35,-20 Q -30,-15 -25,-20" stroke="#8b5a3c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 25,-25 Q 30,-20 35,-25" stroke="#8b5a3c" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 25,-20 Q 30,-15 35,-20" stroke="#8b5a3c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Líneas de expresión entre cejas -->
    <line x1="-5" y1="-35" x2="-5" y2="-25" stroke="#8b5a3c" stroke-width="1.5" opacity="0.4"/>
    <line x1="5" y1="-35" x2="5" y2="-25" stroke="#8b5a3c" stroke-width="1.5" opacity="0.4"/>
    <!-- Ojos -->
    <circle cx="-20" cy="-10" r="3" fill="#4a2c2a"/>
    <circle cx="20" cy="-10" r="3" fill="#4a2c2a"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 280)">
    <polygon points="0,-10 20,0 0,10" fill="#3b82f6" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#3b82f6" stroke-width="3"/>
  </g>

  <!-- Rostro después (derecha) - sin arrugas -->
  <g transform="translate(550, 280)">
    <circle cx="0" cy="0" r="70" fill="#f3d5c8" opacity="0.95"/>
    <!-- Piel lisa, sin arrugas visibles -->
    <!-- Ojos -->
    <circle cx="-20" cy="-10" r="3" fill="#4a2c2a"/>
    <circle cx="20" cy="-10" r="3" fill="#4a2c2a"/>
    <!-- Brillo de juventud -->
    <circle cx="-25" cy="5" r="10" fill="white" opacity="0.3"/>
    <circle cx="25" cy="5" r="10" fill="white" opacity="0.3"/>
  </g>

  <!-- Puntos de aplicación de Botox (antes) -->
  <g transform="translate(250, 280)">
    <circle cx="-30" cy="-30" r="2" fill="#3b82f6" opacity="0.6"/>
    <circle cx="30" cy="-30" r="2" fill="#3b82f6" opacity="0.6"/>
    <circle cx="-5" cy="-38" r="2" fill="#3b82f6" opacity="0.6"/>
    <circle cx="5" cy="-38" r="2" fill="#3b82f6" opacity="0.6"/>
    <circle cx="-35" cy="-15" r="2" fill="#3b82f6" opacity="0.6"/>
    <circle cx="35" cy="-15" r="2" fill="#3b82f6" opacity="0.6"/>
  </g>

  <!-- Jeringa de Botox -->
  <g transform="translate(400, 150)">
    <rect x="-4" y="-50" width="8" height="70" fill="#9ca3af" opacity="0.9"/>
    <polygon points="0,-50 -6,-62 6,-62" fill="#6b7280" opacity="0.9"/>
    <circle cx="0" cy="-68" r="4" fill="#3b82f6" opacity="0.7"/>
    <!-- Líquido -->
    <rect x="-3" y="-30" width="6" height="30" fill="#3b82f6" opacity="0.5"/>
    <!-- Escala -->
    <line x1="4" y1="-20" x2="7" y2="-20" stroke="#6b7280" stroke-width="1"/>
    <line x1="4" y1="-10" x2="7" y2="-10" stroke="#6b7280" stroke-width="1"/>
    <line x1="4" y1="0" x2="7" y2="0" stroke="#6b7280" stroke-width="1"/>
  </g>

  <!-- Vial de Botox -->
  <g transform="translate(500, 150)">
    <rect x="-12" y="-35" width="24" height="50" rx="3" fill="#e5e7eb" opacity="0.9"/>
    <rect x="-10" y="-5" width="20" height="18" fill="#3b82f6" opacity="0.6"/>
    <!-- Etiqueta -->
    <rect x="-8" y="-25" width="16" height="12" fill="white" opacity="0.9"/>
    <text x="0" y="-16" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6" text-anchor="middle" font-weight="bold">BTX</text>
    <!-- Tapa -->
    <rect x="-14" y="-40" width="28" height="8" rx="2" fill="#1e40af"/>
  </g>

  <!-- Símbolo de relajación muscular -->
  <g transform="translate(320, 400)">
    <path d="M 0,0 Q 10,-10 20,0" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 0,0 Q 10,10 20,0" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4"/>
    <text x="30" y="5" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Relajación</text>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Botox
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Rejuvenecimiento Facial
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#3b82f6" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Probado
  </text>
</svg>
