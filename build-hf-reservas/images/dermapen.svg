<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado rosa profesional -->
  <rect width="800" height="600" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Patrón decorativo de puntos -->
  <circle cx="100" cy="100" r="3" fill="#ea899a" opacity="0.3"/>
  <circle cx="700" cy="500" r="3" fill="#ea899a" opacity="0.3"/>
  <circle cx="150" cy="450" r="2" fill="#ea899a" opacity="0.3"/>
  <circle cx="650" cy="150" r="2" fill="#ea899a" opacity="0.3"/>

  <!-- Icono de microagujas (estilizado) -->
  <g transform="translate(400, 300)">
    <!-- Dispositivo Dermapen simplificado -->
    <rect x="-40" y="-120" width="80" height="180" rx="10" fill="#ea899a" opacity="0.9"/>
    <rect x="-35" y="-115" width="70" height="170" rx="8" fill="white" opacity="0.3"/>

    <!-- Cabezal con microagujas -->
    <rect x="-45" y="60" width="90" height="40" rx="5" fill="#d37989"/>

    <!-- Microagujas (puntos) -->
    <circle cx="-25" cy="90" r="2" fill="white"/>
    <circle cx="-10" cy="90" r="2" fill="white"/>
    <circle cx="5" cy="90" r="2" fill="white"/>
    <circle cx="20" cy="90" r="2" fill="white"/>

    <circle cx="-25" cy="75" r="2" fill="white"/>
    <circle cx="-10" cy="75" r="2" fill="white"/>
    <circle cx="5" cy="75" r="2" fill="white"/>
    <circle cx="20" cy="75" r="2" fill="white"/>

    <!-- Efectos de regeneración (ondas) -->
    <circle cx="0" cy="120" r="60" stroke="#ea899a" stroke-width="2" fill="none" opacity="0.3"/>
    <circle cx="0" cy="120" r="80" stroke="#ea899a" stroke-width="2" fill="none" opacity="0.2"/>
    <circle cx="0" cy="120" r="100" stroke="#ea899a" stroke-width="2" fill="none" opacity="0.1"/>
  </g>

  <!-- Texto -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Dermapen
  </text>
  <text x="400" y="515" font-family="Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">
    Microagujas
  </text>

  <!-- Badge decorativo -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#ea899a" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    DermicaPro
  </text>
</svg>
