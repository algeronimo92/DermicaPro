<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado rosa-gris -->
  <rect width="800" height="600" fill="url(#gradBorradoTattoo)"/>
  <defs>
    <linearGradient id="gradBorradoTattoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Brazo con tatuaje antes (izquierda) -->
  <g transform="translate(250, 300)">
    <!-- Brazo -->
    <rect x="-40" y="-100" width="80" height="200" rx="20" fill="#f3d5c8" opacity="0.9"/>
    <!-- Tatuaje (estrella oscura) -->
    <polygon points="0,-40 10,-15 35,-15 15,0 25,25 0,10 -25,25 -15,0 -35,-15 -10,-15" fill="#2d3748" opacity="0.8"/>
  </g>

  <!-- Flecha de transformación -->
  <g transform="translate(400, 300)">
    <polygon points="0,-10 20,0 0,10" fill="#ea899a" opacity="0.9"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#ea899a" stroke-width="3"/>
  </g>

  <!-- Brazo limpio después (derecha) -->
  <g transform="translate(550, 300)">
    <!-- Brazo sin tatuaje -->
    <rect x="-40" y="-100" width="80" height="200" rx="20" fill="#f3d5c8" opacity="0.9"/>
    <!-- Marca de estrella muy tenue -->
    <polygon points="0,-40 10,-15 35,-15 15,0 25,25 0,10 -25,25 -15,0 -35,-15 -10,-15" fill="#f3d5c8" opacity="0.3"/>
  </g>

  <!-- Láser Q-Switch -->
  <g transform="translate(400, 150)">
    <rect x="-25" y="-60" width="50" height="100" rx="8" fill="#ea899a" opacity="0.9"/>
    <circle cx="0" cy="-40" r="12" fill="#dc2626" opacity="0.7"/>
    <!-- Pulsos láser -->
    <line x1="0" y1="-28" x2="0" y2="30" stroke="#dc2626" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#fbbf24" opacity="0.5"/>
    <circle cx="0" cy="15" r="4" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- Texto -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ea899a" text-anchor="middle">
    Borrado de Tatuajes
  </text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Tecnología Láser Q-Switch
  </text>

  <!-- Badge -->
  <rect x="620" y="30" width="150" height="50" rx="25" fill="#dc2626" opacity="0.9"/>
  <text x="695" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Efectivo
  </text>
</svg>
